[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfleet"
version = "0.1.0"
description = "KV-cache-aware client-side routing, load balancing and scheduling over an OpenAI-compatible (vLLM-first) replica fleet"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
llmfleet = "llmfleet.cli:main"

[tool.setuptools]
packages = ["llmfleet"]
package-dir = { "llmfleet" = "." }
